name: Set up Ollama
description: Install Ollama, cache downloaded models, start the server and pull one model.
inputs:
  model:
    description: Ollama model tag to pull
    required: true
runs:
  using: composite
  steps:
    - name: Cache Ollama models
      uses: actions/cache@v4
      with:
        path: ~/.ollama
        key: ollama-${{ inputs.model }}

    - name: Install and start Ollama
      shell: bash
      run: |
        for attempt in 1 2 3 4 5; do
          if curl -fsSL https://ollama.com/install.sh | sh; then break; fi
          if [ "$attempt" = 5 ]; then echo "Ollama install failed after 5 attempts"; exit 1; fi
          echo "Install attempt $attempt failed, retrying..."
          sleep $((attempt * 20))
        done
        nohup ollama serve >/tmp/ollama.log 2>&1 &
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        cat /tmp/ollama.log
        exit 1

    - name: Pull and verify the model
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
      run: |
        for attempt in 1 2 3 4 5; do
          if ollama pull "$MODEL"; then break; fi
          if [ "$attempt" = 5 ]; then echo "Model pull failed after 5 attempts"; exit 1; fi
          echo "Pull attempt $attempt failed, retrying..."
          sleep $((attempt * 20))
        done
        ollama list
        curl --fail --silent --show-error --retry 5 --retry-delay 5 http://127.0.0.1:11434/v1/models
