name: GitHub Brain Cycle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-brain.yml"
      - "scripts/run_github_cycle.py"
      - "app/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      question:
        description: "Question for the five worlds (stored publicly in this repository)"
        required: false
        type: string
        default: "Review the previous public learning records. Identify one measurable weakness, propose a safe experiment, and define how its result should be evaluated."
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: inteligen-brain-cycle
  cancel-in-progress: false

jobs:
  run-five-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODEL_NAME: qwen3:1.7b
      MODEL_BASE_URL: http://127.0.0.1:11434/v1
      WORLD_CONCURRENCY: "1"
      REQUEST_TIMEOUT_SECONDS: "600"
      DATABASE_PATH: data/memory.sqlite3
      INTELIGEN_SEMANTIC_MEMORY: "1"
      FASTEMBED_CACHE_PATH: ~/.cache/fastembed
      BRAIN_QUESTION: ${{ github.event.inputs.question || 'Review the previous public learning records. Identify one measurable weakness, propose a safe experiment, and define how its result should be evaluated.' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore long-term SQLite memory
        uses: actions/cache/restore@v4
        with:
          path: data/memory.sqlite3
          key: inteligen-memory-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            inteligen-memory-v1-

      - name: Restore local embedding model cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/fastembed
          key: inteligen-fastembed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            inteligen-fastembed-v1-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-semantic.txt pytest

      - name: Run regression tests
        run: pytest -q

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Download and verify the local model
        run: |
          ollama pull "$MODEL_NAME"
          ollama list
          curl --fail --silent --show-error http://127.0.0.1:11434/v1/models

      - name: Compile application and runner
        run: python -m compileall -q app scripts

      - name: Run central brain and five worlds
        run: python scripts/run_github_cycle.py

      - name: Save local embedding model cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/fastembed
          key: inteligen-fastembed-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save long-term SQLite memory
        if: always() && hashFiles('data/memory.sqlite3') != ''
        uses: actions/cache/save@v4
        with:
          path: data/memory.sqlite3
          key: inteligen-memory-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}