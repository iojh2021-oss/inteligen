name: GitHub Brain Cycle

# Runs the central brain and the five worlds on a temporary GitHub-hosted runner.
# Triggered manually or daily. It is intentionally not triggered by code pushes,
# because one cycle downloads a model and takes many minutes of CPU inference.
on:
  workflow_dispatch:
    inputs:
      question:
        description: "Question for the five worlds (stored publicly in this repository)"
        required: false
        type: string
        default: "Review the previous public learning records. Identify one measurable weakness, propose a safe experiment, and define how its result should be evaluated."
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with the Evolution workflow: both commit state, so they must not overlap.
concurrency:
  group: inteligen-state
  cancel-in-progress: false

jobs:
  run-five-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODEL_NAME: qwen3:1.7b
      MODEL_BASE_URL: http://127.0.0.1:11434/v1
      WORLD_CONCURRENCY: "1"
      REQUEST_TIMEOUT_SECONDS: "600"
      DATABASE_PATH: data/memory.sqlite3
      BRAIN_QUESTION: ${{ github.event.inputs.question || 'Review the previous public learning records. Identify one measurable weakness, propose a safe experiment, and define how its result should be evaluated.' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run regression tests
        run: pytest -q

      - name: Set up Ollama and the model
        uses: ./.github/actions/setup-ollama
        with:
          model: qwen3:1.7b

      - name: Compile application and runner
        run: python -m compileall -q app scripts

      - name: Run central brain and five worlds
        run: python scripts/run_github_cycle.py

      - name: Persist public memory, evolution history and dashboard state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ is ignored locally; force-add the intended durable SQLite memory.
          git add -f data/memory.sqlite3
          git add docs/state evolution
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Record GitHub brain cycle"
            # The cycle takes a while; main may have moved meanwhile.
            git pull --rebase origin main
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: run-five-worlds
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
