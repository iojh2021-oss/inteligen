name: GitHub Brain Cycle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-brain.yml"
      - "scripts/run_github_cycle.py"
      - "app/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      question:
        description: "Question for the five worlds (stored publicly in this repository)"
        required: false
        type: string
        default: "Review the previous public learning records. Identify one measurable weakness, propose a safe experiment, and define how its result should be evaluated."
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: inteligen-brain-cycle
  cancel-in-progress: false

jobs:
  run-five-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODEL_NAME: qwen3:1.7b
      MODEL_BASE_URL: http://127.0.0.1:11434/v1
      WORLD_CONCURRENCY: "1"
      REQUEST_TIMEOUT_SECONDS: "600"
      DATABASE_PATH: data/memory.sqlite3
      BRAIN_QUESTION: \${{ github.event.inputs.question || 'Review the previous public learning records. Identify one measurable weakness, propose a safe experiment, and define how its result should be evaluated.' }}
    steps:
      - name: Checkout main as the initial workspace
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore durable brain-state branch
        run: |
          git fetch origin main
          if git fetch origin automation/brain-state; then
            git checkout -B automation/brain-state origin/automation/brain-state
            git merge --no-edit origin/main
          else
            git checkout -B automation/brain-state origin/main
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run regression tests
        run: pytest -q

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Download and verify the local model
        run: |
          ollama pull "$MODEL_NAME"
          ollama list
          curl --fail --silent --show-error http://127.0.0.1:11434/v1/models

      - name: Compile application and runner
        run: python -m compileall -q app scripts

      - name: Run central brain and five worlds
        run: python scripts/run_github_cycle.py

      - name: Persist state on an isolated branch and open a review PR
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/memory.sqlite3
          git add docs/state/latest.json docs/state/metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "Record GitHub brain cycle"
            git push --set-upstream origin automation/brain-state
          else
            echo "No state changes to commit."
          fi
          if ! gh pr view automation/brain-state >/dev/null 2>&1; then
            if git diff --quiet origin/main...HEAD; then
              echo "No state changes to propose."
            else
              gh pr create \
                --base main \
                --head automation/brain-state \
                --title "Automated Inteligen brain-state update" \
                --body "Generated state and long-term memory from the GitHub-hosted five-world cycle. Review the run output and state diff before merging. No generated code is auto-promoted."
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: \${{ github.token }}
