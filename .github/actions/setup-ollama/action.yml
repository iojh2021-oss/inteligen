name: Set up Ollama
description: Install Ollama, cache downloaded models, start the server and pull one model.
inputs:
  model:
    description: Ollama model tag to pull
    required: true
runs:
  using: composite
  steps:
    - name: Cache Ollama models
      uses: actions/cache@v4
      with:
        path: ~/.ollama
        key: ollama-${{ inputs.model }}

    - name: Install and start Ollama
      shell: bash
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        nohup ollama serve >/tmp/ollama.log 2>&1 &
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        cat /tmp/ollama.log
        exit 1

    - name: Pull and verify the model
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
      run: |
        ollama pull "$MODEL"
        ollama list
        curl --fail --silent --show-error http://127.0.0.1:11434/v1/models
