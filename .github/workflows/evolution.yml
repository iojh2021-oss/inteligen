name: Evolution Engine

# Proposal-only evolution. "evaluate" builds one candidate version and tests it against the
# stable version in the simulation lab. "promote" and "rollback" change the stable version and
# are human actions: only people with write access can dispatch this workflow, and the actor
# is recorded as the approver in evolution/stable.json.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        default: evaluate
        options:
          - evaluate
          - promote
          - rollback
      proposal_id:
        description: "promote: proposal id, for example p-20261109T040000"
        required: false
        type: string
      version:
        description: "rollback: version number to restore, for example 1"
        required: false
        type: string
  schedule:
    - cron: "47 4 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: inteligen-state
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ACTION: ${{ github.event.inputs.action || 'evaluate' }}
      PROPOSAL_ID: ${{ github.event.inputs.proposal_id }}
      VERSION: ${{ github.event.inputs.version }}
      MODEL_NAME: qwen3:1.7b
      MODEL_BASE_URL: http://127.0.0.1:11434/v1
      WORLD_CONCURRENCY: "1"
      REQUEST_TIMEOUT_SECONDS: "600"
      DATABASE_PATH: data/memory.sqlite3
      LAB_MAX_QUESTIONS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore state from the state branch
        run: bash scripts/state_sync.sh pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run regression tests
        run: pytest -q

      - name: Set up Ollama and the model
        if: env.ACTION == 'evaluate'
        uses: ./.github/actions/setup-ollama
        with:
          model: qwen3:1.7b

      - name: Run the evolution engine
        run: |
          case "$ACTION" in
            evaluate) python scripts/run_evolution.py evaluate ;;
            promote)  python scripts/run_evolution.py promote --proposal "$PROPOSAL_ID" ;;
            rollback) python scripts/run_evolution.py rollback --version "$VERSION" ;;
            *) echo "Unknown action"; exit 1 ;;
          esac

      - name: Persist state to the state branch
        run: bash scripts/state_sync.sh push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: run-engine
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
